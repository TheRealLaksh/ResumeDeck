# The ResumeDeck site on Cloudflare (replaces Vercel). `npm run deploy:cf` builds and deploys.
# The share-link API is a separate Worker in /worker.
name = "resumedeck-web"
main = "edge/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Unknown paths (/priya, /laksh, ...) get index.html, like the old Vercel rewrite. Only /api/* runs the Worker first.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "resumedeck.lakshpradhwani.com"
custom_domain = true
